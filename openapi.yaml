openapi: 3.0.3
info:
  title: SeasonGG Services API
  description: API for managing seasons, games, and user authentication
  version: 0.1
  contact:
    name: SeasonGG
servers:
  - url: http://localhost:3000
    description: Local development server
  - url: http://localhost:8080
    description: Default Micronaut server

paths:
  /v1/games/popular:
    get:
      summary: Get popular games
      operationId: getPopularGames
      tags:
        - Games
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Successfully retrieved popular games
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GameDto'
      x-roles:
        - anonymous

  /v1/seasons:
    get:
      summary: List all seasons
      operationId: listSeasons
      tags:
        - Seasons
      parameters:
        - name: page
          in: query
          required: false
          description: Zero-based page index
          schema:
            type: integer
            format: int32
            default: 0
        - name: size
          in: query
          required: false
          description: Number of results per page
          schema:
            type: integer
            format: int32
            default: 20
        - name: sort
          in: query
          required: false
          description: Sort criteria in the format `property,(asc|desc)`. Multiple sort params are supported.
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: Successfully retrieved paginated list of seasons
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageSeasonDto'
      x-roles:
        - anonymous

    post:
      summary: Create a new season
      operationId: createSeason
      tags:
        - Seasons
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeasonDto'
      responses:
        '200':
          description: Season created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeasonDto'
      x-roles:
        - authenticated

  /v1/seasons/{id}:
    get:
      summary: Get season by ID
      operationId: getSeasonById
      tags:
        - Seasons
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successfully retrieved season
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeasonDto'
      x-roles:
        - anonymous

    put:
      summary: Update a season
      operationId: updateSeason
      tags:
        - Seasons
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeasonDto'
      responses:
        '200':
          description: Season updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeasonDto'
      x-roles:
        - authenticated
      x-permissions:
        resourceType: SEASON
        permissionType: WRITE

    delete:
      summary: Delete a season
      operationId: deleteSeason
      tags:
        - Seasons
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Season deleted successfully
      x-roles:
        - authenticated
      x-permissions:
        resourceType: SEASON
        permissionType: WRITE

  /v1/seasons/{id}/rounds:
    post:
      summary: Create a round in a season
      operationId: createRound
      tags:
        - Rounds
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoundDto'
      responses:
        '200':
          description: Round created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeasonDto'
      x-roles:
        - authenticated
      x-permissions:
        resourceType: SEASON
        permissionType: WRITE

  /v1/seasons/{id}/rounds/{roundId}:
    get:
      summary: Get a round in a season
      operationId: getRound
      tags:
        - Rounds
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: roundId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Successfully retrieved round
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoundDto'
      x-roles:
        - authenticated

    delete:
      summary: Delete a round from a season
      operationId: deleteRound
      tags:
        - Rounds
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: roundId
          in: path
          required: true
          schema:
            type: string
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Round deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoundDto'
      x-roles:
        - authenticated
      x-permissions:
        resourceType: SEASON
        permissionType: WRITE

  /v1/users/register:
    post:
      summary: Register a new user
      operationId: register
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
      responses:
        '200':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
      x-roles:
        - anonymous

components:
  schemas:
    GameDto:
      type: object
      description: Data Transfer Object for a game
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier for the game
        name:
          type: string
          description: Name of the game
        image:
          type: string
          description: Image URL for the game

    SeasonDto:
      type: object
      description: Data Transfer Object for a season
      properties:
        id:
          type: string
          description: Unique identifier for the season
        name:
          type: string
          description: Name of the season
        gameId:
          type: integer
          format: int64
          description: ID of the game associated with this season
        rounds:
          type: array
          description: List of rounds in this season
          items:
            $ref: '#/components/schemas/RoundDto'
        createdAt:
          type: string
          format: date-time
          description: When the season was created
        updatedAt:
          type: string
          format: date-time
          description: When the season was last updated

    PageSeasonDto:
      type: object
      description: A paginated list of seasons
      properties:
        content:
          type: array
          description: The seasons in the current page
          items:
            $ref: '#/components/schemas/SeasonDto'
        pageNumber:
          type: integer
          format: int32
          description: Current zero-based page index
        totalSize:
          type: integer
          format: int64
          description: Total number of seasons across all pages
        totalPages:
          type: integer
          format: int32
          description: Total number of pages

    RoundDto:
      type: object
      description: Data Transfer Object for a round
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier for the round
        seasonId:
          type: string
          description: ID of the season this round belongs to
        name:
          type: string
          description: Name of the round
        order:
          type: integer
          description: Order of the round within the season
        createdAt:
          type: string
          format: date-time
          description: When the round was created
        updatedAt:
          type: string
          format: date-time
          description: When the round was last updated

    UserDto:
      type: object
      description: Data Transfer Object for a user
      properties:
        id:
          type: string
          description: Unique identifier for the user
        email:
          type: string
          format: email
          description: Email address of the user
        username:
          type: string
          description: Username of the user
        createdAt:
          type: string
          format: date-time
          description: When the user was created

    UserRegistrationRequest:
      type: object
      description: Request body for user registration
      required:
        - email
        - username
        - password
      properties:
        email:
          type: string
          format: email
          description: Email address for the new user
        username:
          type: string
          description: Username for the new user
        password:
          type: string
          format: password
          description: Password for the new user

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Bearer token for authentication

security:
  - BearerAuth: []